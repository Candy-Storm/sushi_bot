<script>
    const tg = window.Telegram?.WebApp || {};
    if (tg.ready) tg.ready();
    if (tg.expand) tg.expand();

    const canvas = document.getElementById("wheel");
    const ctx = canvas.getContext("2d");
    const actionBtn = document.getElementById("actionBtn");
    const statusDiv = document.getElementById("status");

    const sectors = [
        { label: "🎲 +1 спін", color: "#9B59B6" },
        { label: "🍣 Рол 1 грн", color: "#FF6B81" },
        { label: "🥤 Напій", color: "#FF4757" },
        { label: "💸 Знижка 10%", color: "#2ED573" },
        { label: "💰 Знижка 15%", color: "#1E90FF" },
        { label: "🌀 Ще раз", color: "#FFA502" }
    ];

    const numSectors = sectors.length;
    const arc = (2 * Math.PI) / numSectors;
    let currentAngle = 0;
    let isSpinning = false;
    let wonPrize = null;

    function drawWheel() {
        const radius = canvas.width / 2;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        sectors.forEach((sector, i) => {
            const angle = currentAngle + i * arc;
            
            ctx.beginPath();
            ctx.fillStyle = sector.color;
            ctx.moveTo(radius, radius);
            ctx.arc(radius, radius, radius, angle, angle + arc);
            ctx.lineTo(radius, radius);
            ctx.fill();
            ctx.strokeStyle = "#111113";
            ctx.lineWidth = 4;
            ctx.stroke();

            ctx.save();
            ctx.translate(radius, radius);
            const midAngle = angle + arc / 2;
            ctx.rotate(midAngle);

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 17px -apple-system, sans-serif";
            
            const normalizedAngle = (midAngle % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
            if (normalizedAngle > Math.PI / 2 && normalizedAngle < (3 * Math.PI) / 2) {
                ctx.rotate(Math.PI);
                ctx.textAlign = "left";
                ctx.fillText(sector.label, -radius + 30, 6);
            } else {
                ctx.textAlign = "right";
                ctx.fillText(sector.label, radius - 30, 6);
            }

            ctx.restore();
        });

        ctx.beginPath();
        ctx.arc(radius, radius, 30, 0, 2 * Math.PI);
        ctx.fillStyle = "#111113";
        ctx.fill();
        ctx.strokeStyle = "#FF4757";
        ctx.lineWidth = 4;
        ctx.stroke();
    }

    drawWheel();

    actionBtn.addEventListener("click", () => {
        // Якщо приз вже виграно — відправляємо
        if (wonPrize) {
            tg.HapticFeedback?.impactOccurred?.('medium');
            statusDiv.innerText = "🎁 Надсилаємо у чат...";
            actionBtn.disabled = true;

            if (tg.sendData) {
                tg.sendData(JSON.stringify({ prize: wonPrize }));
            } else {
                alert("Виграш: " + wonPrize + " (Тестовий режим поза Telegram)");
            }
            return;
        }

        if (isSpinning) return;
        isSpinning = true;
        actionBtn.disabled = true;

        tg.HapticFeedback?.impactOccurred?.('heavy');

        const extraRounds = 6 + Math.floor(Math.random() * 4);
        const winIndex = Math.floor(Math.random() * numSectors);
        
        const targetAngle = (2 * Math.PI * extraRounds) - (winIndex * arc) - (arc / 2) - (Math.PI / 2);
        
        let start = null;
        const duration = 4000;

        function animate(timestamp) {
            if (!start) start = timestamp;
            const progress = (timestamp - start) / duration;

            if (progress < 1) {
                const easeOut = 1 - Math.pow(1 - progress, 3);
                currentAngle = targetAngle * easeOut;
                drawWheel();
                requestAnimationFrame(animate);
            } else {
                currentAngle = targetAngle;
                drawWheel();
                
                tg.HapticFeedback?.notificationOccurred?.('success');

                wonPrize = sectors[winIndex].label;

                actionBtn.innerText = "🎁 ЗАБРАТИ ПРИЗ!";
                actionBtn.classList.add("claim-btn");
                actionBtn.disabled = false;
                statusDiv.innerText = "Вітаємо! Натисніть кнопку вище 👆";
            }
        }

        requestAnimationFrame(animate);
    });
</script>
